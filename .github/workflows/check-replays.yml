name: Check Replays

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to check (Generals or GeneralsMD)"
      userdata:
        required: true
        type: string
        description: "Path to folder with replays and maps"
      preset:
        required: true
        type: string
        description: "CMake preset"
      stage5:
        required: false
        type: boolean
        default: false
        description: "Run the exact installed-runtime Stage 5 worker matrix"
      stage5_fixture_manifest:
        required: false
        type: string
        default: ""
        description: "Repository-relative explicit Stage 5 fixture manifest"
      stage5_require_x64:
        required: false
        type: boolean
        default: false
        description: "Require the installed Stage 5 candidate to be a native x64 PE"
      stage5_replay_matrix_repeats:
        required: false
        type: number
        default: 2
        description: "Complete Stage 5 replay matrix passes"
      stage5_stress_repeats:
        required: false
        type: number
        default: 3
        description: "Stress fixture executions per configuration and pass"
      stage5_performance_baseline:
        required: false
        type: string
        default: ""
        description: "Repository-relative Stage 3 performance baseline JSON; enables the performance gate when paired with its expected executable hash"
      stage5_expected_stage3_executable_sha256:
        required: false
        type: string
        default: ""
        description: "Independently recorded SHA-256 for the Stage 3 x64 executable"
      stage5_acceptance_manifest:
        required: false
        type: string
        default: ""
        description: "Repository-relative reviewed final Stage 5 acceptance manifest"
      stage5_execution_cohort_nonce:
        required: false
        type: string
        default: ""
        description: "Fresh execution cohort UUID minted by the caller before either title runs"
      stage5_execution_cohort_created_utc:
        required: false
        type: string
        default: ""
        description: "UTC creation timestamp for the caller-minted execution cohort"

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.stage5 && 240 || 15 }}
    env:
      GAME_PATH: C:\GameData
      GENERALS_PATH: C:\GameData\Generals
      GENERALSMD_PATH: C:\GameData\GeneralsMD
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Download Game Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}
          path: build

      - name: Cache Game Data
        id: cache-gamedata
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.GAME_PATH }}
          key: gamedata-permanent-cache-v4

      - name: Download Game Data from Cloudflare R2
        if: ${{ steps.cache-gamedata.outputs.cache-hit != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          EXPECTED_HASH_GENERALS: "37A351AA430199D1F05DEB9E404857DCE7B461A6AC272C5D4A0B5652CDB06372"
          EXPECTED_HASH_GENERALSMD: "6837FE1E3009A4C239406C39B1598216C0943EE8ED46BB10626767029AC05E21"
        shell: pwsh
        run: |
          # Download trimmed gamedata of both Generals 1.08 and Generals Zero Hour 1.04.
          # This data cannot be used for playing because it's
          # missing textures, audio and gui files. But it's enough for replay checking.
          # It's also encrypted because it's not allowed to distribute these files.

          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY -or -not $env:AWS_ENDPOINT_URL) {
              $ok1 = [bool]$env:AWS_ACCESS_KEY_ID
              $ok2 = [bool]$env:AWS_SECRET_ACCESS_KEY
              $ok3 = [bool]$env:AWS_ENDPOINT_URL
              Write-Host "One or more required secrets are not set or are empty. R2_ACCESS_KEY_ID: $ok1, R2_SECRET_ACCESS_KEY: $ok2, R2_ENDPOINT_URL: $ok3"
              exit 1
          }

          # Download Generals Game Files
          # The archive contains these files:
          # BINKW32.DLL
          # English.big
          # INI.big
          # Maps.big
          # mss32.dll
          # W3D.big
          # Data\Scripts\MultiplayerScripts.scb
          # Data\Scripts\SkirmishScripts.scb

          Write-Host "Downloading Game Data for Generals" -ForegroundColor Cyan
          aws s3 cp s3://github-ci/generals108_gamedata_trimmed.7z generals108_gamedata_trimmed.7z --endpoint-url $env:AWS_ENDPOINT_URL

          Write-Host "Verifying File Integrity" -ForegroundColor Cyan
          $fileHash = (Get-FileHash -Path generals108_gamedata_trimmed.7z -Algorithm SHA256).Hash
          Write-Host "Downloaded file SHA256: $fileHash"
          Write-Host "Expected file SHA256: $env:EXPECTED_HASH_GENERALS"
          if ($fileHash -ne $env:EXPECTED_HASH_GENERALS) {
              Write-Error "Hash verification failed! File may be corrupted or tampered with."
              exit 1
          }

          Write-Host "Extracting Archive" -ForegroundColor Cyan
          $extractPath = $env:GENERALS_PATH
          & 7z x generals108_gamedata_trimmed.7z -o"$extractPath"
          Remove-Item generals108_gamedata_trimmed.7z -Verbose

          # Download GeneralsMD (ZH) Game Files
          # The archive contains these files:
          # BINKW32.DLL
          # INIZH.big
          # MapsZH.big
          # mss32.dll
          # W3DZH.big
          # Data\Scripts\MultiplayerScripts.scb
          # Data\Scripts\Scripts.ini
          # Data\Scripts\SkirmishScripts.scb

          Write-Host "Downloading Game Data for GeneralsMD" -ForegroundColor Cyan
          aws s3 cp s3://github-ci/zerohour104_gamedata_trimmed.7z zerohour104_gamedata_trimmed.7z --endpoint-url $env:AWS_ENDPOINT_URL

          Write-Host "Verifying File Integrity" -ForegroundColor Cyan
          $fileHash = (Get-FileHash -Path zerohour104_gamedata_trimmed.7z -Algorithm SHA256).Hash
          Write-Host "Downloaded file SHA256: $fileHash"
          Write-Host "Expected file SHA256: $env:EXPECTED_HASH_GENERALSMD"
          if ($fileHash -ne $env:EXPECTED_HASH_GENERALSMD) {
              Write-Error "Hash verification failed! File may be corrupted or tampered with."
              exit 1
          }

          Write-Host "Extracting Archive" -ForegroundColor Cyan
          $extractPath = $env:GENERALSMD_PATH
          & 7z x zerohour104_gamedata_trimmed.7z -o"$extractPath"
          Remove-Item zerohour104_gamedata_trimmed.7z -Verbose

      - name: Set Up Game Data
        shell: pwsh
        run: |
          $source = "$env:GAME_PATH\${{ inputs.game }}"
          $destination = "build"
          if ('${{ inputs.stage5 }}' -eq 'true') {
            # The native artifact already carries its own runtime closure.  The
            # trimmed archive is data-only for Stage 5: copying its retired
            # root DLLs would silently reintroduce Bink/Miles/D3D8 beside the
            # installed x64 candidate.
            Get-ChildItem -LiteralPath $source -File |
              Where-Object { $_.Extension -ieq '.big' } |
              ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
              }
            $dataDirectory = Join-Path $source 'Data'
            if (Test-Path -LiteralPath $dataDirectory -PathType Container) {
              Copy-Item -LiteralPath $dataDirectory -Destination $destination -Recurse -Force
            }
          }
          else {
            Copy-Item -Path $source\* -Destination $destination -Recurse -Force
          }

      - name: Move Replays and Maps to User Dir
        if: ${{ !inputs.stage5 }}
        shell: pwsh
        run: |
          # These files are expected in the user dir, so we move them here.

          $source = "${{ inputs.userdata }}\Replays"
          $destination = "$env:USERPROFILE\Documents\Command and Conquer Generals Zero Hour Data\Replays"
          Write-Host "Move replays to $destination"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Move-Item -Path "$source\*" -Destination $destination -Force

          $source = "${{ inputs.userdata }}\Maps"
          $destination = "$env:USERPROFILE\Documents\Command and Conquer Generals Zero Hour Data\Maps"
          Write-Host "Move maps to $destination"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Move-Item -Path "$source\*" -Destination $destination -Force

      - name: Run Replay Compatibility Tests
        if: ${{ !inputs.stage5 }}
        shell: pwsh
        run: |
          # The legacy replay executable still needs the retail InstallPath, but
          # this reusable workflow must leave the hosted runner exactly as it was
          # found. Snapshot both registry views before setup and restore every
          # value/key in finally, including when process startup or timeout fails.
          $installSubKey = 'Software\Electronic Arts\EA Games\Generals'
          # Snapshot every parent created by CreateSubKey as well as the leaf.
          # This lets rollback remove only newly-created empty ancestors, in
          # reverse order, without deleting concurrent user content.
          $installParentSubKeys = @(
            'Software',
            'Software\Electronic Arts',
            'Software\Electronic Arts\EA Games'
          )
          $registrySnapshots = @()

          function Get-InstallPathSnapshot {
            param([Microsoft.Win32.RegistryView]$View)
            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser, $View)
            try {
              $parentSnapshots = @(
                foreach ($parentSubKey in $installParentSubKeys) {
                  $parentKey = $null
                  try {
                    $parentKey = $base.OpenSubKey($parentSubKey, $false)
                    [pscustomobject]@{
                      subKey = $parentSubKey
                      hadKey = $null -ne $parentKey
                    }
                  }
                  finally {
                    if ($null -ne $parentKey) { $parentKey.Dispose() }
                  }
                }
              )
              $key = $null
              $key = $base.OpenSubKey($installSubKey, $false)
              try {
                $hasValue = $null -ne $key -and ($key.GetValueNames() -contains 'InstallPath')
                return [pscustomobject]@{
                  view = $View
                  hadKey = $null -ne $key
                  hadValue = $hasValue
                  parentSnapshots = $parentSnapshots
                  oldValue = if ($hasValue) {
                    $key.GetValue('InstallPath', $null,
                      [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                  } else { $null }
                  oldValueKind = if ($hasValue) { $key.GetValueKind('InstallPath') } else { $null }
                }
              }
              finally {
                if ($null -ne $key) { $key.Dispose() }
              }
            }
            finally { $base.Dispose() }
          }

          function Set-InstallPath {
            param([Microsoft.Win32.RegistryView]$View, [string]$Value)
            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser, $View)
            try {
              $key = $null
              $key = $base.CreateSubKey($installSubKey)
              try {
                $key.SetValue('InstallPath', $Value,
                  [Microsoft.Win32.RegistryValueKind]::String)
              }
              finally { $key.Dispose() }
            }
            finally { $base.Dispose() }
          }

          function Restore-InstallPath {
            param([object]$Snapshot)
            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser, $Snapshot.view)
            try {
              if ($Snapshot.hadValue) {
                $key = $base.CreateSubKey($installSubKey)
                try {
                  $key.SetValue('InstallPath', $Snapshot.oldValue, $Snapshot.oldValueKind)
                }
                finally { $key.Dispose() }
              }
              else {
                $key = $null
                $key = $base.OpenSubKey($installSubKey, $true)
                if ($null -ne $key) {
                  try {
                    if ($key.GetValueNames() -contains 'InstallPath') {
                      $key.DeleteValue('InstallPath', $false)
                    }
                    if (-not $Snapshot.hadKey) {
                      $remainingValues = @($key.GetValueNames())
                      $remainingSubKeys = @($key.GetSubKeyNames())
                      if ($remainingValues.Count -eq 0 -and $remainingSubKeys.Count -eq 0) {
                        $key.Dispose()
                        $key = $null
                        $base.DeleteSubKey($installSubKey, $false)
                      } else {
                        throw "Registry key $installSubKey gained concurrent content; refusing to remove it."
                      }
                    }
                  }
                  finally {
                    if ($null -ne $key) { $key.Dispose() }
                  }
                }
              }

              # Remove newly-created ancestors only after their children.  A
              # second read immediately before each deletion makes concurrent
              # values/subkeys fail closed instead of being removed.
              foreach ($parentSnapshot in @($Snapshot.parentSnapshots | Sort-Object {
                @($installParentSubKeys).IndexOf($_.subKey)
              } -Descending)) {
                if ($parentSnapshot.hadKey) { continue }
                $parentKey = $null
                $parentKey = $base.OpenSubKey($parentSnapshot.subKey, $true)
                if ($null -eq $parentKey) { continue }
                try {
                  $remainingValues = @($parentKey.GetValueNames())
                  $remainingSubKeys = @($parentKey.GetSubKeyNames())
                  if ($remainingValues.Count -ne 0 -or $remainingSubKeys.Count -ne 0) {
                    throw "Registry ancestor $($parentSnapshot.subKey) gained concurrent content; refusing to remove it."
                  }
                  $parentKey.Dispose()
                  $parentKey = $null
                  $base.DeleteSubKey($parentSnapshot.subKey, $false)
                }
                finally {
                  if ($null -ne $parentKey) { $parentKey.Dispose() }
                }
              }
            }
            finally { $base.Dispose() }
          }

          function Get-ReplayProcessIdentity {
            param([Parameter(Mandatory = $true)][int]$ProcessId)
            $processInfo = Get-CimInstance -ClassName Win32_Process `
              -Filter ("ProcessId = {0}" -f $ProcessId) -ErrorAction SilentlyContinue
            if ($null -eq $processInfo) { return $null }
            if ([string]::IsNullOrWhiteSpace([string]$processInfo.ExecutablePath)) {
              throw "Could not bind replay PID $ProcessId to an executable path."
            }
            $parentInfo = Get-CimInstance -ClassName Win32_Process `
              -Filter ("ProcessId = {0}" -f [int]$processInfo.ParentProcessId) `
              -ErrorAction SilentlyContinue
            [pscustomobject]@{
              processId = [int]$processInfo.ProcessId
              executablePath = [IO.Path]::GetFullPath([string]$processInfo.ExecutablePath)
              creationToken = [string]$processInfo.CreationDate
              parentProcessId = [int]$processInfo.ParentProcessId
              parentCreationToken = if ($null -eq $parentInfo) { '' } else { [string]$parentInfo.CreationDate }
            }
          }

          function Stop-ReplayProcessSafely {
            param(
              [Parameter(Mandatory = $true)][Diagnostics.Process]$Process,
              [AllowNull()][object]$ExpectedIdentity = $null,
              [int]$PostKillWaitMilliseconds = 30000
            )
            if ($Process.HasExited) {
              # The process exited between the timeout check and cleanup.  Do
              # not issue a second termination against a potentially reused PID.
              return $false
            }
            if ($null -ne $ExpectedIdentity) {
              $currentIdentity = $null
              try {
                $currentIdentity = Get-ReplayProcessIdentity $Process.Id
              }
              catch {
                # CIM is supplementary evidence only.  The Process object
                # returned by Start-Process remains bound to the original OS
                # process handle, so retain it when CIM cannot refresh.
                Write-Warning "Could not refresh replay PID $($Process.Id) identity; terminating through the original Process handle."
              }
              if ($null -ne $currentIdentity) {
                $sameExecutable = [String]::Equals(
                  $currentIdentity.executablePath, $ExpectedIdentity.executablePath,
                  [StringComparison]::OrdinalIgnoreCase)
                $sameCreation = $currentIdentity.creationToken -ceq $ExpectedIdentity.creationToken
                $sameParent = $currentIdentity.parentProcessId -eq $ExpectedIdentity.parentProcessId -and
                  $currentIdentity.parentCreationToken -ceq $ExpectedIdentity.parentCreationToken
                if (-not ($sameExecutable -and $sameCreation -and $sameParent)) {
                  throw "Refusing to stop replay PID $($Process.Id) because its path or process/parent creation identity changed."
                }
              }
              elseif ($Process.HasExited) {
                return $false
              }
              else {
                Write-Warning "Replay PID $($Process.Id) identity is unavailable; terminating through the original Process handle."
              }
            }
            try {
              # Kill only through the Process instance retained immediately
              # after Start-Process.  Never reacquire by PID: doing so reopens
              # a PID-reuse TOCTOU window between identity inspection and kill.
              $Process.Kill()
            }
            catch {
              try {
                if ($Process.HasExited) { return $false }
              }
              catch { }
              throw "Identity-bound replay process termination failed: $($_.Exception.Message)"
            }
            if (-not $Process.WaitForExit($PostKillWaitMilliseconds)) {
              throw "Replay PID $($Process.Id) did not exit within the bounded post-kill wait."
            }
            return $true
          }

          $exePath = "build/generalszh.exe"
          $arguments = "-jobs 4 -headless -replay *.rep"
          $timeoutSeconds = 10*60
          $stdoutPath = "stdout.log"
          $stderrPath = "stderr.log"

          if (-not (Test-Path $exePath)) {
              Write-Host "ERROR: Executable not found at $exePath"
              exit 1
          }
          $expectedExePath = [IO.Path]::GetFullPath((Resolve-Path -LiteralPath $exePath).Path)
          if ($null -eq (Get-ReplayProcessIdentity $PID)) {
            throw 'Identity-bound replay cleanup is unavailable; refusing to launch the legacy replay job.'
          }

          # Note that the game is a gui application. That means we need to redirect console output to a file
          # in order to retrieve it.
          # Clean previous logs
          Remove-Item $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

          $exitCode = 1
          $process = $null
          $processIdentity = $null
          try {
            foreach ($view in @([Microsoft.Win32.RegistryView]::Registry32,
                                [Microsoft.Win32.RegistryView]::Registry64)) {
              $registrySnapshots += Get-InstallPathSnapshot $view
              Set-InstallPath $view ($env:GENERALS_PATH + '\')
            }

            # Start the process only after both registry views have been captured.
            Write-Host "Run $exePath $arguments"
            $process = Start-Process -FilePath $exePath `
                -ArgumentList $arguments `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath `
                -PassThru

            try {
              $processIdentity = Get-ReplayProcessIdentity $process.Id
            }
            catch {
              Write-Warning "Could not capture replay PID $($process.Id) identity; retaining the original Process handle for bounded cleanup."
              $processIdentity = $null
            }
            if ($null -eq $processIdentity -and -not $process.HasExited) {
              Write-Warning "Replay PID $($process.Id) identity is unavailable; retaining the original Process handle for bounded cleanup."
            }
            if ($null -ne $processIdentity -and
                -not [String]::Equals($processIdentity.executablePath, $expectedExePath,
                    [StringComparison]::OrdinalIgnoreCase)) {
              throw "Replay process path does not match the requested executable: $($processIdentity.executablePath)"
            }

            $exited = $process.WaitForExit($timeoutSeconds * 1000)
            if (-not $exited) {
                Write-Host "ERROR: Process still running after $timeoutSeconds seconds. Killing process..."
                $stopped = Stop-ReplayProcessSafely $process $processIdentity
                $process.Refresh()
                if (-not $stopped -and $process.HasExited) {
                  $exitCode = $process.ExitCode
                } else {
                  $exitCode = 1
                }
            } else {
                $exitCode = $process.ExitCode
            }

            Write-Host "=== STDOUT ==="
            Get-Content $stdoutPath
            if ((Test-Path $stderrPath) -and (Get-Item $stderrPath).Length -gt 0) {
                Write-Host "`n=== STDERR ==="
                Get-Content $stderrPath
            }
          }
          finally {
            $restoreErrors = @()
            if ($null -ne $process) {
              try {
                $process.Refresh()
                if (-not $process.HasExited) {
                  Stop-ReplayProcessSafely $process $processIdentity | Out-Null
                }
              }
              catch { $restoreErrors += $_.Exception.Message }
              finally { $process.Dispose() }
            }
            for ($index = $registrySnapshots.Count - 1; $index -ge 0; --$index) {
              try { Restore-InstallPath $registrySnapshots[$index] }
              catch { $restoreErrors += $_.Exception.Message }
            }
            if ($restoreErrors.Count -gt 0) {
              throw "Legacy replay registry restoration failed after every attempt: $($restoreErrors -join ' | ')"
            }
          }

          if ($exitCode -ne 0) {
              Write-Host "ERROR: Process failed with exit code $exitCode"
              exit $exitCode
          }

          Write-Host "Success!"

      - name: Audit Replay Worker Mode Propagation
        shell: pwsh
        run: |
          & "Core/Tools/DeterministicSimulationValidation/Audit-ReplayModePropagation.ps1" `
            -SourceRoot "${{ github.workspace }}"

      - name: Run Stage 5 Installed-Runtime Replay Matrix
        if: ${{ inputs.stage5 }}
        shell: pwsh
        env:
          STAGE5_FIXTURE_MANIFEST: ${{ inputs.stage5_fixture_manifest }}
          STAGE5_PERFORMANCE_BASELINE: ${{ inputs.stage5_performance_baseline }}
          STAGE5_EXPECTED_STAGE3_EXECUTABLE_SHA256: ${{ inputs.stage5_expected_stage3_executable_sha256 }}
          STAGE5_ACCEPTANCE_MANIFEST: ${{ inputs.stage5_acceptance_manifest }}
          STAGE5_EXECUTION_COHORT_NONCE: ${{ inputs.stage5_execution_cohort_nonce }}
          STAGE5_EXECUTION_COHORT_CREATED_UTC: ${{ inputs.stage5_execution_cohort_created_utc }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceFull = [IO.Path]::GetFullPath("${{ github.workspace }}")
          function Resolve-Stage5RepositoryFile {
            param([string]$RelativePath, [string]$Context)
            if ([string]::IsNullOrWhiteSpace($RelativePath) -or
                [IO.Path]::IsPathRooted($RelativePath)) {
              throw "$Context must be a non-empty repository-relative path."
            }
            $candidate = [IO.Path]::GetFullPath((Join-Path $workspaceFull $RelativePath))
            $base = $workspaceFull.TrimEnd('\')
            $baseRoot = [IO.Path]::GetPathRoot($base)
            $candidateRoot = [IO.Path]::GetPathRoot($candidate)
            if ($baseRoot -isnot [string] -or $candidateRoot -isnot [string] -or
                -not $baseRoot.Equals($candidateRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$Context must stay below the checked-out repository."
            }
            $baseParts = @($base.Substring($baseRoot.Length) -split '[\\/]' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            $candidateParts = @($candidate.Substring($candidateRoot.Length) -split '[\\/]' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($candidateParts.Count -le $baseParts.Count) {
              throw "$Context must stay below the checked-out repository."
            }
            for ($index = 0; $index -lt $baseParts.Count; ++$index) {
              if (-not $candidateParts[$index].Equals($baseParts[$index],
                  [StringComparison]::OrdinalIgnoreCase)) {
                throw "$Context must stay below the checked-out repository."
              }
            }
            $current = $base
            foreach ($segment in @($candidateParts[$baseParts.Count..($candidateParts.Count - 1)])) {
              $current = Join-Path $current $segment
              if (-not (Test-Path -LiteralPath $current)) { break }
              $item = Get-Item -LiteralPath $current -Force -ErrorAction Stop
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "$Context contains a reparse-point path component: $current"
              }
            }
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "$Context was not found: $RelativePath"
            }
            return $candidate
          }

          $manifest = [string]$env:STAGE5_FIXTURE_MANIFEST
          $manifestPath = Resolve-Stage5RepositoryFile $manifest 'Stage 5 fixture manifest'
          if ([IO.Path]::GetFileName($manifestPath) -match '(?i)\.(?:example|sample)\.') {
            throw 'Stage 5 requires a reviewed fixture manifest; example/sample manifests are not accepted.'
          }
          $manifestDocument = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $expectedTitle = if ('${{ inputs.game }}' -ceq 'Generals') { 'Generals' } else { 'ZeroHour' }
          if ([int]$manifestDocument.schemaVersion -ne 1 -or
              [string]$manifestDocument.title -cne $expectedTitle) {
            throw "Stage 5 fixture manifest must be schema 1 for title $expectedTitle."
          }
          $manifestExecutableHash = [string]$manifestDocument.executableSha256
          if ($manifestExecutableHash -notmatch '^[0-9A-Fa-f]{64}$' -or
              $manifestExecutableHash -match '^0{64}$') {
            throw 'Stage 5 fixture manifest must contain a non-placeholder executable SHA-256.'
          }
          $fixtures = @($manifestDocument.fixtures)
          if ($fixtures.Count -ne 10) {
            throw "Stage 5 requires the reviewed ten-replay corpus; manifest contains $($fixtures.Count) fixtures."
          }
          if (@($fixtures | Where-Object { $_.stress -eq $true }).Count -ne 1) {
            throw 'Stage 5 requires exactly one stress replay in the reviewed ten-replay corpus.'
          }
          $fixtureIds = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          $fixtureHashes = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          foreach ($fixture in $fixtures) {
            $fixtureId = [string]$fixture.id
            $fixtureSource = [string]$fixture.source
            $fixtureHash = [string]$fixture.sha256
            if (-not $fixtureIds.Add($fixtureId)) {
              throw "Stage 5 fixture manifest repeats fixture id '$fixtureId'."
            }
            if ([IO.Path]::GetExtension($fixtureSource) -ine '.rep') {
              throw "Stage 5 fixture '$fixtureId' is not a replay source: $fixtureSource"
            }
            $fixturePath = Resolve-Stage5RepositoryFile $fixtureSource "Stage 5 fixture '$fixtureId'"
            if ($fixtureHash -notmatch '^[0-9A-Fa-f]{64}$' -or $fixtureHash -match '^0{64}$') {
              throw "Stage 5 fixture '$fixtureId' has a missing or placeholder SHA-256."
            }
            $actualFixtureHash = (Get-FileHash -LiteralPath $fixturePath -Algorithm SHA256).Hash
            if ($actualFixtureHash -cne $fixtureHash.ToUpperInvariant()) {
              throw "Stage 5 fixture '$fixtureId' SHA-256 does not match its reviewed source."
            }
            if (-not $fixtureHashes.Add($fixtureHash.ToUpperInvariant())) {
              throw "Stage 5 fixture '$fixtureId' reuses another fixture source SHA-256."
            }
          }

          $baseline = [string]$env:STAGE5_PERFORMANCE_BASELINE
          $expectedStage3Hash = [string]$env:STAGE5_EXPECTED_STAGE3_EXECUTABLE_SHA256
          if ([string]::IsNullOrWhiteSpace($baseline) -or
              [string]::IsNullOrWhiteSpace($expectedStage3Hash)) {
            throw 'Stage 5 full qualification requires stage5_performance_baseline and stage5_expected_stage3_executable_sha256.'
          }
          if ($expectedStage3Hash -notmatch '^[0-9A-Fa-f]{64}$' -or
              $expectedStage3Hash -match '^0{64}$') {
            throw 'Stage 5 full qualification requires a non-placeholder Stage 3 executable SHA-256.'
          }
          $baselinePath = Resolve-Stage5RepositoryFile $baseline 'Stage 5 performance baseline'
          $acceptance = [string]$env:STAGE5_ACCEPTANCE_MANIFEST
          $acceptancePath = Resolve-Stage5RepositoryFile $acceptance 'Stage 5 final acceptance manifest'
          if ([IO.Path]::GetFileName($acceptancePath) -match '(?i)\.(?:example|sample)\.') {
            throw 'Stage 5 final acceptance requires a reviewed manifest; example/sample manifests are not accepted.'
          }
          $acceptanceDocument = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          $acceptanceSourceCommit = ([string]$acceptanceDocument.sourceCommit).ToLowerInvariant()
          if ([int]$acceptanceDocument.schemaVersion -ne 1 -or
              [string]$acceptanceDocument.gateName -cne 'final-stage5-acceptance' -or
              $acceptanceSourceCommit -notmatch '^[0-9a-f]{40}$' -or
              $acceptanceSourceCommit -cne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'Stage 5 final acceptance manifest is stale or has an unsupported schema.'
          }
          $acceptanceArtifactReference = $acceptanceDocument.artifactSet
          if ($null -eq $acceptanceArtifactReference -or
              [string]::IsNullOrWhiteSpace([string]$acceptanceArtifactReference.path)) {
            throw 'Stage 5 final acceptance manifest is missing its artifact-set reference.'
          }
          $artifactSetPath = Resolve-Stage5RepositoryFile (Join-Path (Split-Path -Parent $acceptancePath) ([string]$acceptanceArtifactReference.path)) 'Stage 5 artifact set'
          $artifactSetHash = (Get-FileHash -LiteralPath $artifactSetPath -Algorithm SHA256).Hash
          if ($artifactSetHash -cne ([string]$acceptanceArtifactReference.sha256).ToUpperInvariant()) {
            throw 'Stage 5 artifact-set SHA-256 does not match the reviewed acceptance manifest.'
          }
          $artifactSetDocument = Get-Content -LiteralPath $artifactSetPath -Raw | ConvertFrom-Json
          if ([int]$artifactSetDocument.schemaVersion -ne 1 -or
              [string]$artifactSetDocument.sourceCommit -cne $acceptanceSourceCommit -or
              [string]$artifactSetDocument.architecture -cne 'x64') {
            throw 'Stage 5 artifact set is stale or not an x64 artifact set for the checked-out commit.'
          }
          $runtimeClosure = $artifactSetDocument.runtimeClosure
          if ($null -eq $runtimeClosure -or $null -eq $runtimeClosure.dependencyManifest -or
              [string]$runtimeClosure.dependencyManifest.sha256 -notmatch '^[0-9A-Fa-f]{64}$' -or
              [string]$runtimeClosure.closureSha256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'Stage 5 artifact set is missing canonical runtime-closure hashes.'
          }
          $executionCohortNonce = [string]$env:STAGE5_EXECUTION_COHORT_NONCE
          $executionCohortCreatedUtc = [string]$env:STAGE5_EXECUTION_COHORT_CREATED_UTC
          if ($executionCohortNonce -notmatch '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-5][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$') {
            throw 'Stage 5 requires a fresh caller-minted execution cohort nonce.'
          }
          [DateTimeOffset]$executionCohortCreated = [DateTimeOffset]::MinValue
          if (-not [DateTimeOffset]::TryParse($executionCohortCreatedUtc, [ref]$executionCohortCreated)) {
            throw 'Stage 5 requires a valid caller-minted execution cohort creation timestamp.'
          }

          $candidateName = [string]$manifestDocument.executable
          if ($candidateName -notmatch '^[A-Za-z0-9._-]+\.exe$') {
            throw 'Stage 5 fixture manifest executable must be a leaf .exe name.'
          }
          $runtimeRoot = (Resolve-Path "build").Path
          $candidatePath = Join-Path $runtimeRoot $candidateName
          if (-not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
            Write-Error "Stage 5 installed candidate was not found: $candidateName"
            exit 1
          }
          $retiredRuntimeNames = @(
            'd3d8.dll', 'd3d8d.dll', 'd3dx8.dll', 'd3dx8d.dll',
            'd3dx8_*.dll', 'mss32.dll', 'mss32d.dll',
            'binkw32.dll', 'binkw32d.dll'
          )
          $retiredRuntimeFiles = @(Get-ChildItem -LiteralPath $runtimeRoot -Recurse -File -Force -ErrorAction Stop |
            Where-Object {
              $leaf = $_.Name.ToLowerInvariant()
              @($retiredRuntimeNames | Where-Object {
                if ($_.Contains('*')) { $leaf -like $_ } else { $leaf -eq $_ }
              }).Count -gt 0
            })
          if ($retiredRuntimeFiles.Count -gt 0) {
            $retiredPaths = $retiredRuntimeFiles | ForEach-Object { $_.FullName }
            Write-Error "Stage 5 installed runtime contains retired D3D8/Miles/Bink files: $($retiredPaths -join '; ')"
            exit 1
          }
          $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash
          if (-not (Test-Path -LiteralPath 'H:\')) {
            & subst.exe H: "${{ runner.temp }}"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath 'H:\')) {
              throw 'Stage 5 validation could not provision its isolated H: task volume.'
            }
          }
          $taskRoot = 'H:\Stage5SimulationValidationTask'
          New-Item -ItemType Directory -Path $taskRoot -Force | Out-Null
          $outputRoot = Join-Path $taskRoot 'Evidence'
          $requireX64 = '${{ inputs.stage5_require_x64 }}' -eq 'true'
          if ('${{ inputs.preset }}' -notlike 'x64*' -or -not $requireX64) {
            Write-Error 'Stage 5 installed-runtime validation is reserved for an explicitly x64-required job; legacy VC6 replay jobs remain on the compatibility lane.'
            exit 1
          }
          $validationArguments = @(
            '-RuntimeRoot', $runtimeRoot,
            '-FixtureManifestPath', $manifestPath,
            '-OutputRoot', $outputRoot,
            '-TaskRoot', $taskRoot,
            '-AllowHeadlessDirectExecution',
            '-ValidationSet', 'All',
            '-ReplayMatrixRepeats', '${{ inputs.stage5_replay_matrix_repeats }}',
            '-StressRepeats', '${{ inputs.stage5_stress_repeats }}',
            '-ExpectedExecutableSha256', $candidateHash,
            '-Title', '${{ inputs.game == 'Generals' && 'Generals' || 'ZeroHour' }}',
            '-GeneralsInstallRoot', $env:GENERALS_PATH,
            '-MinimumFreeBytes', '2147483648',
            '-EnforcePerformance',
            '-Stage3PerformanceBaselinePath', $baselinePath,
            '-ExpectedStage3ExecutableSha256', $expectedStage3Hash,
            '-AcceptanceSourceCommit', $acceptanceSourceCommit,
            '-AcceptanceArtifactSetSha256', $artifactSetHash,
            '-ExecutionCohortNonce', $executionCohortNonce,
            '-ExecutionCohortCreatedUtc', $executionCohortCreatedUtc,
            '-AcceptanceRuntimeDependencyManifestSha256', ([string]$runtimeClosure.dependencyManifest.sha256),
            '-AcceptanceRuntimeClosureSha256', ([string]$runtimeClosure.closureSha256)
          )
          if ($requireX64) { $validationArguments += '-RequireX64' }
          & "Core/Tools/DeterministicSimulationValidation/Run-DeterministicSimulationValidation.ps1" @validationArguments
          if (-not $?) {
            throw 'Stage 5 ValidationSet All runner failed.'
          }
        # This title lane produces fresh, host-bound receipts. Cross-title
        # pre-manual aggregation runs only after both title lanes and the
        # combined host producer have been assembled; the reviewed
        # repository manifest is never treated as fresh H: evidence here.
        # Invoke-Stage5FinalAcceptance.ps1 is reserved for that assembled
        # cross-title pre-manual step.
        Write-Host 'Stage 5 fresh title receipts are ready for cross-title pre-manual aggregation.'

      - name: Normalize Stage 5 Evidence Paths for Upload
        if: ${{ always() && inputs.stage5 }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/Normalize-Stage5EvidenceForUpload.ps1" `
            -InputRoot "H:\Stage5SimulationValidationTask\Evidence" `
            -OutputRoot "${{ runner.temp }}\Stage5SimulationValidation-upload"

      - name: Upload Debug Log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Replay-Debug-Log-${{ inputs.preset }}
          path: build/DebugLogFile*.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Stage 5 Validation Evidence
        if: ${{ always() && inputs.stage5 }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Stage5-Simulation-Validation-${{ inputs.game }}-${{ inputs.preset }}
          path: ${{ runner.temp }}\Stage5SimulationValidation-upload
          retention-days: 30
          if-no-files-found: error
