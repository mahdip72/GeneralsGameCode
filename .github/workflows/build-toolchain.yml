name: Build Toolchain

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to build (Generals, GeneralsMD)"
      preset:
        required: true
        type: string
        description: "CMake preset"
      tools:
        required: false
        default: true
        type: boolean
        description: "Build tools"
      extras:
        required: false
        default: false
        type: boolean
        description: "Build extras"
      product:
        required: false
        default: true
        type: boolean
        description: "Build the selected game product; disable for focused shared-runtime checks"
      focused_targets:
        required: false
        default: ""
        type: string
        description: "Comma-separated CMake targets for a bounded focused build"
      focused_test_regex:
        required: false
        default: ""
        type: string
        description: "Optional CTest regex for a bounded focused test run"

jobs:
  build:
    name: ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
    runs-on: windows-2022
    timeout-minutes: ${{ startsWith(inputs.preset, 'x64') && 90 || 30 }}

    env:
      VCPKG_FILE_CACHE: ${{ github.workspace }}\vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Cache VC6 Installation
        if: startsWith(inputs.preset, 'vc6')
        id: cache-vc6
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: C:\VC6
          key: vc6-permanent-cache-v2

      - name: Cache CMake Dependencies
        id: cache-cmake-deps
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build\${{ inputs.preset }}\_deps
          key: cmake-deps-${{ inputs.preset }}-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','cmake/patches/*.patch','**/CMakeLists.txt') }}

      - name: Download VC6 Portable from itsmattkc repo
        if: ${{ startsWith(inputs.preset, 'vc6') && steps.cache-vc6.outputs.cache-hit != 'true' }}
        env:
          EXPECTED_HASH: "D0EE1F6DCEF7DB3AD703120D9FB4FAD49EBCA28F44372E40550348B1C00CA583"
          COMMIT: "001c4bafdcf2ef4b474d693acccd35a91e848f40"
        shell: pwsh
        run: |
          Write-Host "Downloading VC6 Portable Installation" -ForegroundColor Cyan
          Invoke-WebRequest -Uri https://github.com/itsmattkc/MSVC600/archive/$env:COMMIT.zip -OutFile VS6_VisualStudio6.zip

          Write-Host "Verifying File Integrity" -ForegroundColor Cyan
          $fileHash = (Get-FileHash -Path VS6_VisualStudio6.zip -Algorithm SHA256).Hash
          Write-Host "Downloaded file SHA256: $fileHash"
          Write-Host "Expected file SHA256: $env:EXPECTED_HASH"
          if ($fileHash -ne $env:EXPECTED_HASH) {
              Write-Error "Hash verification failed! File may be corrupted or tampered with."
              exit 1
          }

          Write-Host "Extracting Archive" -ForegroundColor Cyan
          & Expand-Archive -Path VS6_VisualStudio6.zip -DestinationPath C:\VC6
          Move-Item -Path C:\VC6\MSVC600-$env:COMMIT -Destination C:\VC6\VC6SP6
          Remove-Item VS6_VisualStudio6.zip -Verbose

      - name: Set Up VC6 Environment
        if: startsWith(inputs.preset, 'vc6')
        shell: pwsh
        run: |
          # Define the base directories as local variables first
          $VSCommonDir = "C:\VC6\VC6SP6\Common"
          $MSDevDir = "C:\VC6\VC6SP6\Common\msdev98"
          $MSVCDir = "C:\VC6\VC6SP6\VC98"
          $VcOsDir = "WINNT"

          # Set the variables in GitHub environment
          "VSCommonDir=$VSCommonDir" >> $env:GITHUB_ENV
          "MSDevDir=$MSDevDir" >> $env:GITHUB_ENV
          "MSVCDir=$MSVCDir" >> $env:GITHUB_ENV
          "VcOsDir=$VcOsDir" >> $env:GITHUB_ENV
          "PATH=$MSDevDir\BIN;$MSVCDir\BIN;$VSCommonDir\TOOLS\$VcOsDir;$VSCommonDir\TOOLS;$env:PATH" >> $env:GITHUB_ENV
          "INCLUDE=$MSVCDir\ATL\INCLUDE;$MSVCDir\INCLUDE;$MSVCDir\MFC\INCLUDE;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$MSVCDir\LIB;$MSVCDir\MFC\LIB;$env:LIB" >> $env:GITHUB_ENV

      - name: Set Up VC2022 Environment
        if: startsWith(inputs.preset, 'win32') || startsWith(inputs.preset, 'x64')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ startsWith(inputs.preset, 'x64') && 'x64' || 'x86' }}

      - name: Compute vcpkg cache key parts
        if: contains(inputs.preset, 'vcpkg')
        id: vcpkg_key
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json)."builtin-baseline"

          $triplet = "x86-windows"
          if ("${{ inputs.preset }}" -like "x64*") { $triplet = "x64-windows" }

          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          "triplet=$triplet" >> $env:GITHUB_OUTPUT

          Write-Host "vcpkg cache key parts: baseline=$baseline, triplet=$triplet"

      - name: Restore vcpkg binary cache
        if: contains(inputs.preset, 'vcpkg')
        id: vcpkg_cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-bincache-v3-${{ runner.os }}-baseline${{ steps.vcpkg_key.outputs.baseline }}-${{ steps.vcpkg_key.outputs.triplet }}-manifest${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}-${{ hashFiles('triplets/*.cmake') }}
          restore-keys: |
            vcpkg-bincache-v3-${{ runner.os }}-baseline${{ steps.vcpkg_key.outputs.baseline }}-
            vcpkg-bincache-v3-${{ runner.os }}-

      - name: Setup vcpkg
        if: contains(inputs.preset, 'vcpkg')
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # Keep package versions at the manifest baseline while using the
          # acquire-msys repair that replaces the retired file-5.45-3 archive.
          vcpkgGitCommitId: 6fa128f2b6e1dd260ebfb30fdb1c38a191369812
          runVcpkgInstall: false
          doNotCache: false

      - name: Configure vcpkg to use cached directory
        if: contains(inputs.preset, 'vcpkg')
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}\vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          # lukka/run-vcpkg sets its own temp cache dir; override to force our cached dir
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cacheDir
          $env:VCPKG_BINARY_SOURCES = "clear;files,$cacheDir,readwrite"

          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}\triplets" >> $env:GITHUB_ENV
          "VCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions" >> $env:GITHUB_ENV

      - name: Provision Stage 5 validation scratch
        if: ${{ inputs.extras }}
        shell: pwsh
        run: |
          $scratchToken = "${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.preset }}"
          $scratchToken = [regex]::Replace($scratchToken, '[^A-Za-z0-9._-]', '-')
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP is unavailable for Stage 5 scratch backing.'
          }

          $backingRoot = Join-Path $env:RUNNER_TEMP `
            ('Stage5ValidationH-' + $scratchToken)
          $hDrive = Get-PSDrive -Name H -ErrorAction SilentlyContinue
          $hExists = $null -ne $hDrive -or
            (Test-Path -LiteralPath 'H:\' -PathType Container)
          if (-not $hExists) {
            if (Test-Path -LiteralPath $backingRoot) {
              throw "Stage 5 scratch backing path already exists: $backingRoot"
            }
            New-Item -ItemType Directory -Path $backingRoot -Force | Out-Null
            & subst H: $backingRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Could not map H: to the unique Stage 5 scratch backing path: $backingRoot"
            }
            if (-not (Test-Path -LiteralPath 'H:\' -PathType Container)) {
              throw 'H: was not available after mapping the Stage 5 scratch backing path.'
            }
          }

          $scratchRoot = Join-Path 'H:\Stage5CiScratch' $scratchToken
          if (Test-Path -LiteralPath $scratchRoot) {
            throw "Stage 5 validation scratch path already exists: $scratchRoot"
          }
          New-Item -ItemType Directory -Path $scratchRoot -Force | Out-Null
          if (-not (Test-Path -LiteralPath $scratchRoot -PathType Container)) {
            throw "Stage 5 validation scratch path was not created: $scratchRoot"
          }
          "RTS_STAGE5_VALIDATION_SCRATCH_ROOT=$scratchRoot" >> $env:GITHUB_ENV
          Write-Host "Stage 5 validation scratch: $scratchRoot"

      - name: Configure ${{ inputs.game }} with CMake Using ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Preset
        shell: pwsh
        run: |
          $buildProduct = '${{ inputs.product }}' -eq 'true'
          if ($buildProduct -and '${{ inputs.preset }}' -notlike 'x64*') {
            Write-Error 'Stage 5 product builds are native x64-only. Use product=false for historical authoring and diagnostic presets.'
            exit 1
          }
          $productFlag = if ($buildProduct) { 'ON' } else { 'OFF' }
          # Select the requested title subtree independently from its product
          # executable.  Authoring jobs intentionally keep the subtree ON but
          # pass product=OFF so the reusable workflow cannot resurrect a game
          # executable that the preset explicitly disabled.
          $generalsFlag = if ('${{ inputs.game }}' -eq 'Generals') { 'ON' } else { 'OFF' }
          $zeroHourFlag = if ('${{ inputs.game }}' -eq 'GeneralsMD') { 'ON' } else { 'OFF' }
          $generalsProductFlag = if ($buildProduct -and $generalsFlag -eq 'ON') { 'ON' } else { 'OFF' }
          $zeroHourProductFlag = if ($buildProduct -and $zeroHourFlag -eq 'ON') { 'ON' } else { 'OFF' }
          $buildFlags = @(
            "-DRTS_BUILD_PRODUCT=$productFlag",
            "-DRTS_BUILD_ZEROHOUR=$zeroHourFlag",
            "-DRTS_BUILD_GENERALS=$generalsFlag",
            "-DRTS_BUILD_GENERALS_PRODUCT=$generalsProductFlag",
            "-DRTS_BUILD_ZEROHOUR_PRODUCT=$zeroHourProductFlag"
          )

          $gamePrefix = "${{ inputs.game == 'Generals' && 'GENERALS' || 'ZEROHOUR' }}"
          $buildFlags += "-DRTS_BUILD_CORE_TOOLS=${{ inputs.tools && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_${gamePrefix}_TOOLS=${{ inputs.tools && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_CORE_EXTRAS=${{ inputs.extras && 'ON' || 'OFF' }}"
          $buildFlags += "-DRTS_BUILD_${gamePrefix}_EXTRAS=${{ inputs.extras && 'ON' || 'OFF' }}"
          if (-not [string]::IsNullOrWhiteSpace($env:RTS_STAGE5_VALIDATION_SCRATCH_ROOT)) {
            $buildFlags += "-DRTS_STAGE5_VALIDATION_SCRATCH_ROOT=$env:RTS_STAGE5_VALIDATION_SCRATCH_ROOT"
          }

          Write-Host "Build flags: $($buildFlags -join ' | ')"
          cmake --preset ${{ inputs.preset }} $buildFlags

      - name: Build ${{ inputs.game }} with CMake Using ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Preset
        shell: pwsh
        run: |
          $focusedTargets = '${{ inputs.focused_targets }}'
          if ([string]::IsNullOrWhiteSpace($focusedTargets)) {
            cmake --build --preset ${{ inputs.preset }}
            exit $LASTEXITCODE
          }
          $configuration = if ('${{ inputs.preset }}' -match 'debug|asan') { 'Debug' } else { 'Release' }
          $targets = @($focusedTargets.Split(',') | ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($targets.Count -eq 0) {
            Write-Error 'focused_targets must contain at least one CMake target.'
            exit 1
          }
          foreach ($target in $targets) {
            cmake --build "build\${{ inputs.preset }}" --config $configuration --target $target --parallel 2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run runtime regression tests
        # The standalone harness links only in the release configuration. Debug validation
        # still happens through the normal game executable build in its own matrix jobs.
        if: ${{ inputs.game == 'GeneralsMD' && inputs.extras && inputs.preset == 'win32' }}
        shell: pwsh
        run: |
          $test = Get-ChildItem -Path "build\${{ inputs.preset }}" -Recurse -Filter z_runtime_regression_tests.exe |
            Select-Object -First 1
          if (-not $test) {
            Write-Error "z_runtime_regression_tests.exe was not produced"
            exit 1
          }
          & $test.FullName
          exit $LASTEXITCODE

      - name: Run Core extras tests for ${{ inputs.game }} with ${{ inputs.preset }}
        if: inputs.extras
        shell: pwsh
        run: |
          $scratchRoot = $env:RTS_STAGE5_VALIDATION_SCRATCH_ROOT
          if ([string]::IsNullOrWhiteSpace($scratchRoot) -or
              -not $scratchRoot.StartsWith('H:\', [StringComparison]::OrdinalIgnoreCase) -or
              -not (Test-Path -LiteralPath $scratchRoot -PathType Container)) {
            throw "Stage 5 validation scratch root is not an existing H: directory: $scratchRoot"
          }
          $scratchItem = Get-Item -LiteralPath $scratchRoot -Force
          if (($scratchItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Stage 5 validation scratch root is a reparse point: $scratchRoot"
          }
          $arguments = @('--test-dir', "build\${{ inputs.preset }}", '--output-on-failure', '--no-tests=error')
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.focused_test_regex }}')) {
            $arguments += @('-R', '${{ inputs.focused_test_regex }}')
          }
          if ('${{ inputs.preset }}' -like 'win32*' -or '${{ inputs.preset }}' -like 'x64*') {
            $configuration = if ('${{ inputs.preset }}' -match 'debug|asan') { 'Debug' } else { 'Release' }
            $arguments += @('-C', $configuration)
          }
          $originalPsModulePath = $env:PSModulePath
          $ctestExitCode = 1
          try {
            # CTest launches Windows PowerShell test scripts; let them rebuild
            # their standard module path instead of inheriting pwsh's path.
            Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
            & ctest @arguments
            $ctestExitCode = $LASTEXITCODE
          }
          finally {
            if ($null -eq $originalPsModulePath) {
              Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
            } else {
              $env:PSModulePath = $originalPsModulePath
            }
          }
          exit $ctestExitCode

      - name: Install native runtime for ${{ inputs.game }} with ${{ inputs.preset }}
        if: ${{ inputs.product && startsWith(inputs.preset, 'x64') }}
        shell: pwsh
        run: |
          $configuration = if ('${{ inputs.preset }}' -match 'debug|asan') { 'Debug' } else { 'Release' }
          $buildDir = "build\${{ inputs.preset }}"
          $installRoot = Join-Path $buildDir 'installed'
          cmake --install $buildDir --config $configuration --prefix $installRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $installedRuntime = Join-Path $installRoot '${{ inputs.game == 'Generals' && 'Generals' || 'ZeroHour' }}'
          if (-not (Test-Path -LiteralPath $installedRuntime -PathType Container)) {
            Write-Error "Installed native runtime was not produced at $installedRuntime"
            exit 1
          }

      - name: Run installed native contract tests
        if: ${{ inputs.product && inputs.extras && startsWith(inputs.preset, 'x64') }}
        shell: pwsh
        run: |
          $titleDirectory = '${{ inputs.game == 'Generals' && 'Generals' || 'ZeroHour' }}'
          $testName = '${{ inputs.game == 'Generals' && 'g_skirmish_ai_runner_contract_tests.exe' || 'z_runtime_regression_tests.exe' }}'
          $installedRuntime = [IO.Path]::GetFullPath(
            (Join-Path "build\${{ inputs.preset }}\installed" $titleDirectory))
          $validationRoot = [IO.Path]::GetFullPath(
            (Join-Path "build\${{ inputs.preset }}\installed\Validation" $titleDirectory))
          $test = Join-Path $validationRoot $testName
          if (-not (Test-Path -LiteralPath $test -PathType Leaf)) {
            Write-Error "Installed native contract utility was not produced at $test"
            exit 1
          }

          $testExitCode = 1
          Push-Location $installedRuntime
          try {
            & $test
            $testExitCode = $LASTEXITCODE
            if ($testExitCode -eq 0 -and '${{ inputs.game }}' -eq 'GeneralsMD') {
              & $test --skirmish-ai-replay-epoch
              $testExitCode = $LASTEXITCODE
            }
          }
          finally {
            Pop-Location
          }
          exit $testExitCode

      - name: Save vcpkg binary cache
        # Only one job should save to avoid "Unable to reserve cache" conflicts.
        if: ${{ contains(inputs.preset, 'vcpkg') && steps.vcpkg_cache.outputs.cache-hit != 'true' && inputs.game == 'Generals' && inputs.preset == 'x64-generals-vcpkg-product' }}
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-bincache-v3-${{ runner.os }}-baseline${{ steps.vcpkg_key.outputs.baseline }}-${{ steps.vcpkg_key.outputs.triplet }}-manifest${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}-${{ hashFiles('triplets/*.cmake') }}

      - name: Collect ${{ inputs.game }} ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Artifact
        if: ${{ inputs.product }}
        shell: pwsh
        run: |
          $buildDir = "build\${{ inputs.preset }}"
          $artifactsDir = New-Item -ItemType Directory -Force -Path "$buildDir\${{ inputs.game }}\artifacts" -Verbose

          $installedRuntime = Join-Path $buildDir "installed\${{ inputs.game == 'Generals' && 'Generals' || 'ZeroHour' }}"
          if (-not (Test-Path -LiteralPath $installedRuntime -PathType Container)) {
            Write-Error "Installed native runtime was not found at $installedRuntime"
            exit 1
          }
          Copy-Item -Path (Join-Path $installedRuntime '*') -Destination $artifactsDir -Recurse -Force -Verbose

      - name: Upload ${{ inputs.game }} ${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }} Artifact
        if: ${{ inputs.product }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
          path: build\${{ inputs.preset }}\${{ inputs.game }}\artifacts
          retention-days: 30
          if-no-files-found: error
